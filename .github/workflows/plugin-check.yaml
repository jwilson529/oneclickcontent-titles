name: CI and Release

on:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Audit Composer dependencies
        run: composer audit --locked

      - name: Run PHPCS
        run: npm run check

      - name: Run PHPUnit
        run: npm test

      - name: Build release zip
        run: npm run dist

      - name: Upload release zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: oneclickcontent-titles-release-zip
          path: dist/oneclickcontent-titles.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    concurrency:
      group: wordpress-org-release
      cancel-in-progress: false
    name: Deploy to WordPress.org
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.ref == 'refs/heads/releases/2.2.0'
    permissions:
      contents: write

    steps:
      - name: Checkout code (full history & tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # The release branch is an explicit, version-scoped publication request.
      # Ordinary pushes to main still validate only.
      - name: Verify release version and publication target
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SVN_USERNAME: ${{ secrets.WPORG_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SVN_USERNAME"
          test -n "$SVN_PASSWORD"
          VERSION=$(node -p "require('./package.json').version")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Eq "^[[:space:]]*\\*[[:space:]]*Version:[[:space:]]*$VERSION$" oneclickcontent-titles.php
          grep -qx "Stable tag: $VERSION" readme.txt
          TAG="v$VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$VERSION" = "2.2.0"
            test "$GITHUB_REF" = "refs/heads/releases/2.2.0"
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" -m "Release $TAG"
              git push origin "$TAG"
            fi
          else
            test "$GITHUB_REF" = "refs/tags/$TAG"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build ZIP
        run: npm run dist

      - name: Deploy to WP.org SVN
        id: wporg_deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.WPORG_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_PASSWORD }}
          VERSION: ${{ steps.release.outputs.version }}
          SLUG: oneclickcontent-titles
          BUILD_DIR: dist/oneclickcontent-titles
          ASSETS_DIR: assets

      - name: Attach release zip to GitHub release
        if: steps.wporg_deploy.outputs.zip-path != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.version }}
          body_path: ${{ github.event_name == 'push' && 'release-notes/2.2.0.md' || '' }}
          files: ${{ steps.wporg_deploy.outputs.zip-path }}
          overwrite_files: true
